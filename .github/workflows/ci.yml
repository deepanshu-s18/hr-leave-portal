name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests with coverage
        working-directory: backend
        run: mvn clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          # H2 in-memory DB used in test profile — no Postgres service needed
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Build backend Docker image
        working-directory: backend
        run: |
          mvn package -DskipTests -q
          docker build -t hr-leave-portal-backend:${{ github.sha }} .

  frontend-build:
    name: Frontend — TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (TypeScript check + Vite bundle)
        working-directory: frontend
        run: npm run build
